server.port=8080

# ====== 事件投递服务配置 ======
# 单次回调 HTTP 请求超时（毫秒），超时按可重试失败处理
webhook.delivery.http-timeout-ms=5000
# 最大投递尝试次数（首投 + 重试），耗尽进入死信
webhook.delivery.max-attempts=5
# 指数退避：初始间隔 / 倍率 / 上限（毫秒）
webhook.delivery.backoff-initial-ms=1000
webhook.delivery.backoff-multiplier=2.0
webhook.delivery.backoff-max-ms=60000
# 每个订阅方待投递队列容量，积压达到上限时新发布被拒绝（背压）
webhook.delivery.subscriber-queue-capacity=200
